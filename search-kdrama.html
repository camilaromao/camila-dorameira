<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="globals-kdrama.css">
    <link rel="stylesheet" href="style-kdrama.css">

    <title>Search KDrama</title>
</head>

<body>

    <main class="card-vidro">

        <span class="marca-dev">By Camila Romão</span>

        <div class="cabecalho-pesquisa">
            <h2>Qual o tipo de drama que mais gosta de assistir?</h2>

            <h1>SEARCH KDRAMA</h1>
        </div>

        <form id="form-busca">

            <input
                type="text"
                id="campo-busca"
                placeholder="Digite um tipo de dorama (ex: romance, comédia)..."
                required
            >

            <button type="submit" class="botao-procura">
                PROCURAR DORAMA
            </button>

        </form>


        <!-- ==========================================
             ÁREA DOS RESULTADOS
             ========================================== -->

        <section id="area-resultado" class="escondido"></section>


        <footer class="streamings">
            NETFLIX + VIKI + PRIME VIDEO + DISNEY PLUS
        </footer>

    </main>

    <script src="script-kdrama.js"></script>

</body>
</html>
